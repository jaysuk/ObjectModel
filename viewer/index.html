// ────────────────────────────────────────────────────────────
// Live mode — networking
// ────────────────────────────────────────────────────────────
async function fetchLiveJSON(url, extraHeaders = {}) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 5000);
  try {
    const headers = { ...extraHeaders };
    if (dsfSessionKey) headers['X-Session-Key'] = dsfSessionKey;
    const r = await fetch(url, { signal: controller.signal, headers });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  } finally {
    clearTimeout(tid);
  }
}

// RRF's rr_model response is size-limited. When the JSON is too large it returns
// a `next` key with the name of the next top-level key to request. We handle this
// by first fetching the root (which gives us top-level keys + partial data), then
// fetching each top-level section individually with key=<name> to get full depth.
async function fetchFullRRModel() {
  // Step 1: get root-level keys via a shallow fetch
  const rootRes = await fetchLiveJSON(liveHost + '/rr_model?flags=d99vn');
  if (!rootRes?.result) return null;
  let combined = rootRes.result;
  const topKeys = Object.keys(combined);
  console.log('[live] rr_model top-level keys:', topKeys);

  // Step 2: fetch each top-level section individually to ensure full depth
  for (const key of topKeys) {
    try {
      const res = await fetchLiveJSON(liveHost + '/rr_model?key=' + key + '&flags=d99vn');
      if (res?.result !== undefined) {
        combined[key] = res.result;
      }
    } catch (e) {
      console.warn('[live] rr_model key=' + key + ' failed:', e.message);
    }
  }
  return combined;
}

async function liveConnect() {
  const raw = document.getElementById('hostInput').value.trim();
  if (!raw) return;
  liveHost = raw.startsWith('http') ? raw.replace(/\/$/, '') : 'http://' + raw.replace(/\/$/, '');
  localStorage.setItem('liveHost', raw);

  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.textContent = 'Connecting…';

  // Try standalone RRF: connect first (establishes session), then fetch model
  let connected = false;
  let lastError = '';
  try {
    console.log('[live] trying RRF standalone:', liveHost + '/rr_connect?password=reprap');
    const connRes = await fetchLiveJSON(liveHost + '/rr_connect?password=reprap');
    console.log('[live] rr_connect response:', JSON.stringify(connRes));
    if (typeof connRes.err === 'number') {
      // Fetch full model — rr_model has a response size limit and may return a `next`
      // key indicating more data. Fetch each top-level key individually to get everything.
      const fullModel = await fetchFullRRModel();
      if (fullModel) {
        liveEndpoint = 'rr_model';
        liveData = fullModel;
        connected = true;
      } else {
        lastError = 'rr_model returned no data';
      }
    } else {
      lastError = 'rr_connect err field unexpected: ' + JSON.stringify(connRes);
    }
  } catch (e) {
    lastError = 'RRF standalone: ' + e.message;
    console.warn('[live] RRF standalone failed:', e);
  }

  // Try DSF/SBC — requires /machine/connect to get session key first
  if (!connected) {
    try {
      console.log('[live] trying DSF/SBC:', liveHost + '/machine/connect');
      dsfSessionKey = null;
      const connRes = await fetchLiveJSON(liveHost + '/machine/connect?password=reprap');
      console.log('[live] machine/connect response:', JSON.stringify(connRes));
      if (connRes?.sessionKey) {
        dsfSessionKey = connRes.sessionKey;
        const data = await fetchLiveJSON(liveHost + '/machine/status');
        if (data && typeof data === 'object') {
          liveEndpoint = 'machine_status';
          liveData = data;
          connected = true;
        }
      }
    } catch (e) {
      lastError += ' | DSF: ' + e.message;
      console.warn('[live] DSF failed:', e);
    }
  }

  if (!connected) {
    btn.disabled = false;
    btn.textContent = 'Connect';
    const isCors = lastError.includes('CORS') || lastError.includes('Failed to fetch') || lastError.includes('NetworkError');
    const isFileOrigin = location.protocol === 'file:';
    let msg = 'Could not connect to printer at ' + liveHost;
    if (isCors && isFileOrigin) {
      msg += '\n\nYou are opening this viewer as a local file (file://) which browsers treat as a "null" origin. Even with M586 C"*" enabled on the printer, browsers block cross-origin requests from null origins.\n\nFix: access the viewer over HTTPS instead:\n\n  https://jaysuk.github.io/ObjectModel/viewer/\n\nThis gives it a real origin that RRF\'s CORS headers will accept.';
    } else if (isCors) {
      msg += '\n\nThis is likely a CORS error. Make sure your printer\'s config.g contains:\n\n  M586 C"*"\n\nand that the printer has been rebooted since adding it.';
    } else {
      msg += '\n\nError: ' + lastError;
    }
    showError(msg);
    return;
  }

  liveConnected = true;
  btn.disabled = false;
  btn.textContent = 'Disconnect';
  btn.onclick = liveDisconnect;

  document.getElementById('modeLive').disabled = false;
  document.getElementById('modeRef').disabled = false;

  setDSFIndicator('ok', 'Live: ' + (liveEndpoint === 'rr_model' ? 'RRF standalone' : 'DSF/SBC'));
  startLivePoll();
}

function liveDisconnect() {
  stopLivePoll();
  liveConnected = false;
  liveEndpoint = null;
  liveData = null;
  dsfSessionKey = null;

  const btn = document.getElementById('connectBtn');
  btn.textContent = 'Connect';
  btn.onclick = null;

  document.getElementById('modeLive').disabled = true;
  document.getElementById('liveWarning').style.display = 'none';
  setDSFIndicator('none', 'DSF descriptions: —');

  if (liveMode) switchMode('reference');
}

function startLivePoll() {
  stopLivePoll();
  livePollTimer = setTimeout(livePoll, 1000);
}

function stopLivePoll() {
  if (livePollTimer !== null) { clearTimeout(livePollTimer); livePollTimer = null; }
}

// Deep-merge patch into base object in-place (RRF poll updates are partial patches)
function deepMerge(base, patch) {
  if (patch === null || typeof patch !== 'object' || Array.isArray(patch)) return patch;
  if (base === null || typeof base !== 'object' || Array.isArray(base)) return patch;
  const out = Object.assign({}, base);
  for (const key of Object.keys(patch)) {
    out[key] = deepMerge(base[key], patch[key]);
  }
  return out;
}

async function livePoll() {
  try {
    let data;
    if (liveEndpoint === 'rr_model') {
      // RRF sessions can expire — reconnect transparently if needed
      let json;
      try {
        json = await fetchLiveJSON(liveHost + '/rr_model?flags=d99fn');
      } catch (_) {
        await fetchLiveJSON(liveHost + '/rr_connect?password=reprap');
        json = await fetchLiveJSON(liveHost + '/rr_model?flags=d99fn');
      }
      // d99fn returns only changed fields — merge into the full model
      data = deepMerge(liveData, json.result);
    } else {
      // DSF session can expire — reconnect transparently if needed
      try {
        data = await fetchLiveJSON(liveHost + '/machine/status');
      } catch (_) {
        const connRes = await fetchLiveJSON(liveHost + '/machine/connect?password=reprap');
        if (connRes?.sessionKey) dsfSessionKey = connRes.sessionKey;
        data = await fetchLiveJSON(liveHost + '/machine/status');
      }
    }
    liveData = data;
    if (!liveConnected) {
      liveConnected = true;
      document.getElementById('liveWarning').style.display = 'none';
      setDSFIndicator('ok', 'Live: ' + (liveEndpoint === 'rr_model' ? 'RRF standalone' : 'DSF/SBC'));
    }
    if (liveMode) {
      updateLiveTreeValues(data);
      updateLiveDetailValues(data);
    }
  } catch (e) {
    if (liveConnected) {
      liveConnected = false;
      if (liveMode) document.getElementById('liveWarning').style.display = '';
      setDSFIndicator('error', 'Live: disconnected');
    }
  } finally {
    if (livePollTimer !== null || liveEndpoint !== null) {
      livePollTimer = setTimeout(livePoll, 1000);
    }
  }
}

// ────────────────────────────────────────────────────────────
// Live mode — mode switching
// ────────────────────────────────────────────────────────────
function switchMode(mode) {
  liveMode = (mode === 'live');
  document.getElementById('modeRef').classList.toggle('mode-active', !liveMode);
  document.getElementById('modeLive').classList.toggle('mode-active', liveMode);

  const refOnlyEls = document.querySelectorAll('#expandAllBtn, #collapseAllBtn, #searchBox, #searchClear, #refControls');
  refOnlyEls.forEach(el => { el.style.display = liveMode ? 'none' : ''; });

  if (liveMode) {
    document.getElementById('liveWarning').style.display = liveConnected ? 'none' : '';
    liveNavStack = [];
    liveLastDetailPath = null;
    liveLastDetailLabel = null;
    liveValueCells.clear();
    buildLiveTree(liveData);
    showLiveDetail('', 'objectModel');
  } else {
    document.getElementById('liveWarning').style.display = 'none';
    buildTree();
    if (lastDetailKey) {
      const detail = document.getElementById('detailPanel');
      if (lastDetailType === 'class' && model.classes[lastDetailKey]) {
        detail.innerHTML = renderClassDetail(model.classes[lastDetailKey]);
      } else if (lastDetailType === 'enum' && model.enums[lastDetailKey]) {
        detail.innerHTML = renderEnumDetail(model.enums[lastDetailKey]);
      }
      wireDetailLinks(detail);
    }
  }
}

document.getElementById('modeRef').addEventListener('click', () => { if (liveMode) switchMode('reference'); });
document.getElementById('modeLive').addEventListener('click', () => { if (!liveMode && liveData) switchMode('live'); });
document.getElementById('connectBtn').addEventListener('click', liveConnect);

// ────────────────────────────────────────────────────────────
// Live mode — value helpers
// ────────────────────────────────────────────────────────────
function getValueAtPath(obj, path) {
  if (path === '' || path == null) return obj;
  let cur = obj;
  for (const p of path.split('.')) {
    if (cur == null || typeof cur !== 'object') return undefined;
    cur = cur[p];
  }
  return cur;
}

function formatLiveValue(val) {
  if (val === undefined) return '—';
  if (val === null) return 'null';
  if (typeof val === 'boolean') return String(val);
  if (typeof val === 'number') return String(val);
  if (typeof val === 'string') return '"' + val + '"';
  if (Array.isArray(val)) return '[' + val.length + ']';
  return '{…}';
}

function liveValueClass(val) {
  if (val === null || val === undefined) return 'is-null';
  if (val === true) return 'is-bool-true';
  if (val === false) return 'is-bool-false';
  return '';
}

// ────────────────────────────────────────────────────────────
// Live mode — in-place update
// ────────────────────────────────────────────────────────────
function updateLiveTreeValues(data) {
  document.querySelectorAll('#treeScroll [data-lv]').forEach(el => {
    const path = el.dataset.lv;
    const val = getValueAtPath(data, path);
    const text = formatLiveValue(val);
    if (el.textContent !== text) {
      el.textContent = text;
      el.className = 'live-value ' + liveValueClass(val);
      el.classList.add('live-updated');
      el.addEventListener('animationend', () => el.classList.remove('live-updated'), { once: true });
    }
  });
}

function updateLiveDetailValues(data) {
  liveValueCells.forEach((td, path) => {
    const val = getValueAtPath(data, path);
    const text = formatLiveValue(val);
    if (td.textContent !== text) {
      td.textContent = text;
      td.className = 'val-col ' + liveValueClass(val);
    }
  });
}

// ────────────────────────────────────────────────────────────
// Live mode — tree
// ────────────────────────────────────────────────────────────
function resolveLiveClass(path) {
  if (!path) return model.classes['ObjectModel'] || null;
  let cls = model.classes['ObjectModel'];
  for (const seg of path.split('.')) {
    if (!cls) return null;
    if (/^\d+$/.test(seg)) continue; // array index — element type already resolved
    const prop = (cls.props || []).find(p => p.name === seg);
    if (!prop) return null;
    const inner = resolveCollectionType(prop.type) || prop.type.replace(/\s*\|\s*null/g, '').trim();
    cls = model.classes[inner] || null;
  }
  return cls;
}

function buildLiveTree(data) {
  const scroll = document.getElementById('treeScroll');
  scroll.innerHTML = '';
  if (!data) {
    scroll.innerHTML = '<div class="placeholder">No live data</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  const rootNode = buildLiveNode(data, '', 'objectModel', 0);
  if (rootNode) frag.appendChild(rootNode);
  scroll.appendChild(frag);

  // Auto-expand root
  const rootChildren = rootNode?.querySelector('.tree-children');
  const rootToggle = rootNode?.querySelector('.tree-toggle');
  if (rootChildren && rootToggle) {
    rootChildren.classList.remove('collapsed');
    rootToggle.textContent = '▼';
    rootChildren.dataset.populated = '1';
    populateLiveChildren(data, '', 0, rootChildren);
  }
}

function buildLiveNode(val, path, label, depth) {
  const isObj = val !== null && typeof val === 'object' && !Array.isArray(val);
  const isArr = Array.isArray(val);
  if (!isObj && !isArr) return null; // primitives handled inline by parent

  const node = document.createElement('div');
  node.className = 'tree-node';
  node.dataset.livePath = path;

  const cls = resolveLiveClass(path);
  const clsDesc = cls ? getClassDesc(cls.name) : null;

  let badge = '', badgeCls = 'badge-class';
  if (isArr) { badge = '[' + val.length + ']'; badgeCls = 'badge-collection'; }
  else if (cls && cls.name !== label) { badge = cls.name; badgeCls = 'badge-class'; }

  const { row, toggle } = makeTreeRow(depth, '▶', label, badge, badgeCls, clsDesc?.summary || null);
  node.appendChild(row);
  row.addEventListener('click', () => {
    if (liveMode) showLiveDetail(path, label);
  });

  const children = document.createElement('div');
  children.className = 'tree-children collapsed';
  node.appendChild(children);

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    const collapsed = children.classList.toggle('collapsed');
    toggle.textContent = collapsed ? '▶' : '▼';
    if (!collapsed && !children.dataset.populated) {
      children.dataset.populated = '1';
      populateLiveChildren(val, path, depth, children);
    }
  });

  return node;
}

function populateLiveChildren(val, path, depth, container) {
  const entries = Array.isArray(val)
    ? val.map((v, i) => ({ key: String(i), label: '[' + i + ']', value: v }))
    : Object.entries(val).map(([k, v]) => ({ key: k, label: k, value: v }));

  for (const { key, label, value } of entries) {
    const childPath = path ? path + '.' + key : key;
    const isObj = value !== null && typeof value === 'object';

    if (isObj) {
      const childNode = buildLiveNode(value, childPath, label, depth + 1);
      if (childNode) container.appendChild(childNode);
    } else {
      // Leaf row
      const node = document.createElement('div');
      node.className = 'tree-node';
      const row = document.createElement('div');
      row.className = 'tree-row';

      const indent = document.createElement('span');
      indent.className = 'tree-indent';
      indent.style.width = ((depth + 1) * 16) + 'px';
      const spacer = document.createElement('span');
      spacer.className = 'tree-toggle';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'tree-name';
      nameSpan.textContent = label;

      const valSpan = document.createElement('span');
      valSpan.className = 'live-value dim ' + liveValueClass(value);
      valSpan.textContent = formatLiveValue(value);
      valSpan.dataset.lv = childPath;

      row.appendChild(indent);
      row.appendChild(spacer);
      row.appendChild(nameSpan);
      row.appendChild(valSpan);
      node.appendChild(row);

      // Clicking a leaf selects its parent class in the detail panel
      const parentPath = path;
      row.addEventListener('click', () => { if (liveMode) showLiveDetail(parentPath, parentPath.split('.').pop() || 'objectModel'); });
      container.appendChild(node);
    }
  }

  if (container.children.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:4px 8px;font-size:12px;color:var(--text-dim)';
    empty.textContent = '(empty)';
    container.appendChild(empty);
  }
}

// ────────────────────────────────────────────────────────────
// Live mode — detail panel
// ────────────────────────────────────────────────────────────
function renderLiveBreadcrumb() {
  if (!liveNavStack.length) return '';
  const parts = liveNavStack.map((entry, i) =>
    `<span class="bc-item" data-live-bc="${i}">${escHtml(entry.label)}</span>`
  );
  return `<div class="detail-breadcrumb">${parts.join('<span class="bc-sep">›</span>')}` +
    `<span class="bc-sep">›</span><span class="bc-current">${escHtml(liveLastDetailLabel || '')}</span></div>`;
}

function showLiveDetail(path, label) {
  liveLastDetailPath = path;
  liveLastDetailLabel = label;
  liveValueCells.clear();

  const detail = document.getElementById('detailPanel');
  const val = getValueAtPath(liveData, path);
  const cls = resolveLiveClass(path);

  if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
    detail.innerHTML = renderLiveObjectDetail(val, path, cls);
  } else if (Array.isArray(val)) {
    detail.innerHTML = renderLiveArrayDetail(val, path, cls, label);
  } else {
    detail.innerHTML = `<div class="placeholder" style="margin-top:40px">Select an object in the tree to view details.</div>`;
    return;
  }

  // Wire value cells
  detail.querySelectorAll('[data-lvc]').forEach(td => {
    liveValueCells.set(td.dataset.lvc, td);
  });

  // Wire drilldown rows
  detail.querySelectorAll('tr.prop-row-drilldown[data-live-path]').forEach(row => {
    row.addEventListener('click', () => {
      const p = row.dataset.livePath;
      const l = row.dataset.liveLabel;
      liveNavStack.push({ path: liveLastDetailPath, label: liveLastDetailLabel });
      showLiveDetail(p, l);
    });
  });

  // Wire breadcrumb
  detail.querySelectorAll('[data-live-bc]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.liveBc);
      const entry = liveNavStack[idx];
      if (!entry) return;
      liveNavStack = liveNavStack.slice(0, idx);
      showLiveDetail(entry.path, entry.label);
    });
  });
}

function navigateLiveDetail(path, label) {
  liveNavStack.push({ path: liveLastDetailPath, label: liveLastDetailLabel });
  showLiveDetail(path, label);
}

function renderLiveObjectDetail(val, path, cls) {
  const clsDesc = cls ? getClassDesc(cls.name) : null;
  const hasAnyDesc = cls ? (cls.props || []).some(p => getPropDesc(cls.name, p.name)) : false;

  let html = renderLiveBreadcrumb();
  html += `<h2>${escHtml(liveLastDetailLabel || path || 'objectModel')}</h2>`;

  // OM path chips
  if (cls) {
    const paths = findPaths(cls.name);
    if (paths.length) {
      html += `<div class="om-path">` + paths.map(p => `<code class="om-path-code">${escHtml(p)}</code>`).join('') + `</div>`;
    }
  }

  if (clsDesc?.summary) {
    html += `<div class="class-description">${escHtml(clsDesc.summary)}`;
    if (clsDesc.remarks) html += `<div class="remarks">${escHtml(clsDesc.remarks)}</div>`;
    html += `</div>`;
  }

  // Build rows from live data keys, annotating with model info where available
  const keys = Object.keys(val);
  if (!keys.length) {
    html += `<div style="color:var(--text-dim);font-size:13px;margin-top:16px">No properties.</div>`;
    return html;
  }

  html += `<table class="prop-table"><thead><tr>
    <th>Property</th><th>Type</th><th>Value</th>
    ${hasAnyDesc ? '<th>Description</th>' : ''}
  </tr></thead><tbody>`;

  for (const key of keys) {
    const childVal = val[key];
    const childPath = path ? path + '.' + key : key;
    const prop = cls ? (cls.props || []).find(p => p.name === key) : null;
    const desc = prop && cls ? getPropDesc(cls.name, key) : null;

    // Type display
    let typeHtml = '';
    if (prop) {
      const inner = resolveCollectionType(prop.type);
      const isCol = isCollectionType(prop.type);
      const isDct = isDictType(prop.type);
      const isEnum = !!model.enums[prop.type];
      const isCls = !!model.classes[prop.type];
      if (isCol && inner && (model.classes[inner] || model.enums[inner])) {
        typeHtml = `<span class="prop-type">${escHtml(inner)}[]</span>`;
      } else if (isDct && inner && model.classes[inner]) {
        typeHtml = `<span class="prop-type">${escHtml(inner)}{}</span>`;
      } else if (isCls || isEnum) {
        typeHtml = `<span class="prop-type">${escHtml(prop.type)}</span>`;
      } else {
        typeHtml = `<span class="prop-type">${escHtml(shortType(prop.type))}</span>`;
      }
      if (prop.nullable) typeHtml += ` <span style="color:var(--text-dim);font-size:11px">or null</span>`;

      // SBC badge
      if (desc?.sbcProperty === false) {
        typeHtml += ` <span class="tag tag-sbc-only" title="SBC only">SBC only</span>`;
      } else if (desc?.sbcProperty === true) {
        typeHtml += ` <span class="tag tag-sbc-also" title="SBC managed">SBC</span>`;
      }
    }

    // Is this an object/array that can be drilled into?
    const childIsObj = childVal !== null && typeof childVal === 'object';
    const childCls = childIsObj && !Array.isArray(childVal) ? resolveLiveClass(childPath) : null;
    const isDrillable = childIsObj;
    const rowAttr = isDrillable
      ? ` class="prop-row-drilldown" data-live-path="${escHtml(childPath)}" data-live-label="${escHtml(key)}"`
      : '';
    const chevron = isDrillable ? `<span class="prop-drilldown-chevron">›</span>` : '';

    // Enum inline chips (reference mode style)
    let enumInline = '';
    if (prop && model.enums[prop.type] && !childIsObj) {
      const en = model.enums[prop.type];
      enumInline = `<div class="enum-inline">` +
        en.members.map(m => {
          const md = getEnumMemberDesc(en.name, m.key);
          const active = (childVal === m.value || childVal === m.key) ? ' style="opacity:1;border-color:var(--green)"' : ' style="opacity:0.4"';
          const tip = md?.summary ? ` title="${escHtml(md.summary)}"` : '';
          return `<span class="enum-pip"${active}${tip}>${escHtml(m.key)}</span>`;
        }).join('') + `</div>`;
    }

    // Value cell
    const valText = formatLiveValue(childVal);
    const valCls = 'val-col ' + liveValueClass(childVal);

    // Description
    let descHtml = '';
    if (hasAnyDesc) {
      descHtml = desc?.summary ? escHtml(desc.summary) : `<span style="color:var(--text-dim)">—</span>`;
      if (desc?.remarks) descHtml += `<div class="remarks">${escHtml(desc.remarks)}</div>`;
    }

    html += `<tr${rowAttr}>
      <td><span class="prop-name">${escHtml(key)}</span>${chevron}</td>
      <td>${typeHtml}${enumInline}</td>
      <td class="${escHtml(valCls)}" data-lvc="${escHtml(childPath)}">${escHtml(valText)}</td>
      ${hasAnyDesc ? `<td class="prop-desc-cell">${descHtml}</td>` : ''}
    </tr>`;
  }

  return html + '</tbody></table>';
}

function renderLiveArrayDetail(arr, path, cls, label) {
  let html = renderLiveBreadcrumb();
  html += `<h2>${escHtml(label)}</h2>`;
  html += `<div style="color:var(--text-dim);font-size:13px;margin-bottom:12px">${arr.length} item${arr.length !== 1 ? 's' : ''}</div>`;

  if (!arr.length) return html + `<div style="color:var(--text-dim);font-size:13px">Empty array.</div>`;

  html += `<table class="prop-table"><thead><tr><th>Index</th><th>Value / Object</th></tr></thead><tbody>`;
  arr.forEach((item, i) => {
    const childPath = path + '.' + i;
    const childIsObj = item !== null && typeof item === 'object';
    const rowAttr = childIsObj
      ? ` class="prop-row-drilldown" data-live-path="${escHtml(childPath)}" data-live-label="${escHtml('[' + i + ']')}"`
      : '';
    const chevron = childIsObj ? `<span class="prop-drilldown-chevron">›</span>` : '';
    const valText = childIsObj ? (Array.isArray(item) ? '[' + item.length + ']' : '{…}') : formatLiveValue(item);
    const valCls = childIsObj ? '' : 'val-col ' + liveValueClass(item);
    html += `<tr${rowAttr}>
      <td style="font-family:monospace;color:var(--text-dim)">[${i}]</td>
      <td${childIsObj ? '' : ` class="${escHtml(valCls)}" data-lvc="${escHtml(childPath)}"`}>${escHtml(valText)}${chevron}</td>
    </tr>`;
  });

  return html + '</tbody></table>';
}

// ────────────────────────────────────────────────────────────
// Network scanner
// ────────────────────────────────────────────────────────────

// Probe a single IP. Tries /rr_connect (standalone) then /machine/noop (DSF).
// Returns { ip, boardType, mode } or null if not a Duet.
async function probeDuet(ip) {
  const base = 'http://' + ip;
  // Try standalone first — tiny response, includes boardType
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 1500);
    const r = await fetch(base + '/rr_connect?password=reprap', { signal: ctrl.signal });
    clearTimeout(tid);
    if (r.ok) {
      const j = await r.json();
      // Valid RRF response has err field; boardType present on newer firmware
      if (typeof j.err === 'number') {
        return { ip, boardType: j.boardType || 'Duet (standalone)', mode: 'standalone' };
      }
    }
  } catch (_) {}

  // Try DSF/SBC — /machine/connect returns sessionKey if it's a DSF board
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 1500);
    const r = await fetch(base + '/machine/connect?password=reprap', { signal: ctrl.signal });
    clearTimeout(tid);
    if (r.ok) {
      const j = await r.json();
      if (j?.sessionKey) return { ip, boardType: 'Duet (SBC/DSF)', mode: 'sbc' };
    }
  } catch (_) {}

  return null;
}

// Get the local /24 subnet using WebRTC ICE candidate leak.
// Falls back to null if blocked (Firefox with privacy.resistFingerprinting, etc.)
function getLocalSubnet() {
  return new Promise(resolve => {
    try {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel('');
      const found = new Set();
      const done = () => { pc.close(); resolve(found.size ? [...found][0] : null); };
      const t = setTimeout(done, 1200);
      pc.onicecandidate = e => {
        if (!e.candidate) return;
        const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+)\.\d+/);
        if (m && !m[1].startsWith('169.254') && m[1] !== '127.0.0') {
          found.add(m[1]);
          clearTimeout(t);
          done();
        }
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
    } catch (_) { resolve(null); }
  });
}

// Show a subnet input in the dropdown and return a Promise that resolves
// when the user clicks Scan, or null if they close the dropdown.
function askSubnet(defaultSubnet) {
  const scanStatus = document.getElementById('scanStatus');
  const scanResults = document.getElementById('scanResults');
  scanStatus.textContent = 'Enter your subnet to scan:';
  scanResults.innerHTML = `
    <div style="padding:10px 12px;display:flex;gap:6px;align-items:center">
      <input id="subnetInput" type="text" value="${escHtml(defaultSubnet)}"
        style="flex:1;font-family:monospace" placeholder="192.168.1">
      <span style="font-size:12px;color:var(--text-dim)">.0/24</span>
      <button class="btn" id="subnetScanBtn" style="padding:5px 10px;font-size:12px">Go</button>
    </div>`;
  return new Promise(resolve => {
    const input = document.getElementById('subnetInput');
    const goBtn = document.getElementById('subnetScanBtn');
    const go = e => { e.stopPropagation(); resolve(input.value.trim() || null); };
    goBtn.addEventListener('click', go);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); resolve(input.value.trim() || null); } });
  });
}

let scanAbortFlag = false;
let scanRunning = false;

async function startScan(subnet) {
  const btn = document.getElementById('scanBtn');
  const dropdown = document.getElementById('scanDropdown');
  const scanStatus = document.getElementById('scanStatus');
  const scanResults = document.getElementById('scanResults');

  scanRunning = true;
  scanAbortFlag = false;
  scanResults.innerHTML = '';
  scanStatus.textContent = `Scanning ${subnet}.0/24…`;
  btn.textContent = 'Stop';

  // Build list of all 254 host IPs, scan in parallel batches of 30
  const ips = Array.from({ length: 254 }, (_, i) => `${subnet}.${i + 1}`);
  const BATCH = 30;
  let found = 0;

  for (let i = 0; i < ips.length; i += BATCH) {
    if (scanAbortFlag) break;
    const batch = ips.slice(i, i + BATCH);
    const results = await Promise.all(batch.map(ip => probeDuet(ip)));
    for (const res of results) {
      if (!res) continue;
      found++;
      const item = document.createElement('div');
      item.className = 'scan-result-item';
      item.innerHTML = `
        <span class="scan-result-board">${escHtml(res.boardType)}</span>
        <span class="scan-result-ip">${escHtml(res.ip)}</span>
        <span class="scan-result-mode">${res.mode === 'sbc' ? 'SBC / DSF' : 'Standalone RRF'}</span>`;
      item.addEventListener('click', () => {
        document.getElementById('hostInput').value = res.ip;
        dropdown.style.display = 'none';
        scanAbortFlag = true;
        btn.textContent = 'Scan';
        scanRunning = false;
      });
      scanResults.appendChild(item);
    }
    const done = Math.min(i + BATCH, ips.length);
    scanStatus.textContent = `Scanning ${subnet}.0/24… (${done}/254)${found ? ` — ${found} found` : ''}`;
  }

  scanRunning = false;
  if (!scanAbortFlag) {
    scanStatus.textContent = found
      ? `Found ${found} Duet device${found !== 1 ? 's' : ''} on ${subnet}.0/24`
      : `No Duet devices found on ${subnet}.0/24`;
    btn.textContent = 'Scan';
  }
}

async function runScan() {
  const btn = document.getElementById('scanBtn');
  const dropdown = document.getElementById('scanDropdown');
  const scanStatus = document.getElementById('scanStatus');
  const scanResults = document.getElementById('scanResults');

  // If a scan is running, stop it
  if (scanRunning) {
    scanAbortFlag = true;
    scanRunning = false;
    btn.textContent = 'Scan';
    return;
  }

  // Toggle dropdown closed if already open (idle)
  if (dropdown.style.display !== 'none') {
    dropdown.style.display = 'none';
    btn.textContent = 'Scan';
    return;
  }

  dropdown.style.display = '';
  scanResults.innerHTML = '';
  scanStatus.textContent = 'Detecting local subnet…';

  let subnet = await getLocalSubnet();
  if (!subnet) {
    // Guess a sensible default from the host input if it looks like an IP
    const hostVal = document.getElementById('hostInput').value.trim();
    const hostMatch = hostVal.match(/^(\d+\.\d+\.\d+)\.\d+$/);
    subnet = await askSubnet(hostMatch ? hostMatch[1] : '192.168.1');
    if (!subnet) { btn.textContent = 'Scan'; return; }
  }

  // Validate subnet format (x.x.x)
  if (!/^\d+\.\d+\.\d+$/.test(subnet)) {
    scanStatus.textContent = 'Invalid subnet — use format x.x.x (e.g. 192.168.1)';
    btn.textContent = 'Scan';
    return;
  }

  await startScan(subnet);
}

document.getElementById('scanBtn').addEventListener('click', runScan);

// Close scan dropdown when clicking outside
document.addEventListener('click', e => {
  const dropdown = document.getElementById('scanDropdown');
  if (dropdown.style.display === 'none') return;
  if (!dropdown.contains(e.target) && e.target.id !== 'scanBtn') {
    dropdown.style.display = 'none';
    if (scanRunning) { scanAbortFlag = true; scanRunning = false; }
    document.getElementById('scanBtn').textContent = 'Scan';
  }
});

(async () => {
  document.getElementById('viewerVersion').textContent = 'v' + VIEWER_VERSION;
  const savedHost = localStorage.getItem('liveHost');
  if (savedHost) document.getElementById('hostInput').value = savedHost;
  await loadBranches();
  const sel = document.getElementById('branchSelect');
  if (sel.value) {
    try {
      await loadModel(sel.value);
      buildTree();
    } catch (e) {
      loading(false);
      showError('Auto-load failed: ' + e.message + '\n\nPlease select a branch and click Load.');
      status('Auto-load failed');
      document.getElementById('loadBtn').disabled = false;
    }
  }
})();
